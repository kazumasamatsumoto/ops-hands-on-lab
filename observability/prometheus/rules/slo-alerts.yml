# アラートルール: 条件を満たしたら Alertmanager に知らせます。
#
# SLO「1 か月の成功率 99.9%」に対し、エラーバジェットの消費速度(バーンレート)で鳴らします。
#   バーンレート = 窓のエラー率 ÷ (1 − 0.999)
#
# 「2 つの窓」を両方満たしたときだけ鳴らすのがコツです(マルチウィンドウ):
#   長い窓 … 本当に予算を削るほど続いているか(ちょっとしたぶれでは鳴らさない)
#   短い窓 … 今もまだ起きているか(直ったあとも長い窓に引きずられて鳴り続けない)
#
#   緊急(page)  : 1 時間窓 > 14.4 かつ 5 分窓 > 14.4   … 1 か月の予算の 2% を 1 時間で消費。すぐ人を起こす
#   警告(ticket): 6 時間窓 > 6    かつ 30 分窓 > 6     … 1 か月の予算の 5% を 6 時間で消費。営業時間内に対応
#
# SLO を置いているのは storefront と api だけなので、アラートも {job=~"storefront|api"} に絞っています。
#
# 14.4 の出し方: 予算の 2% を 1 時間で使う → 0.02 × 720 時間(30 日)÷ 1 時間 = 14.4
# 6 の出し方    : 予算の 5% を 6 時間で使う → 0.05 × 720 時間 ÷ 6 時間 = 6

groups:
  - name: slo-burn-rate
    rules:
      - alert: ErrorBudgetBurnPage
        expr: |
          job:slo_burn_rate:5m{job=~"storefront|api"} > 14.4
          and
          job:slo_burn_rate:1h{job=~"storefront|api"} > 14.4
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }}: エラーバジェットを急速に消費しています(緊急)"
          description: "5 分窓のバーンレートが {{ $value | printf \"%.1f\" }} です。このままだと 30 日 ÷ この値 で 1 か月分の予算を使い切ります(基準の 14.4 なら約 2 日、100 なら約 7 時間)。"

      - alert: ErrorBudgetBurnTicket
        expr: |
          job:slo_burn_rate:30m{job=~"storefront|api"} > 6
          and
          job:slo_burn_rate:6h{job=~"storefront|api"} > 6
        for: 5m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }}: エラーバジェットの消費が速めです(警告)"
          description: "30 分窓のバーンレートが {{ $value | printf \"%.1f\" }} です。営業時間内に原因を調べてください。"

  # ---- デモ用(演習で「すぐ鳴る」様子を見るためのもの。本番では使いません) ----
  # 窓を 1 分と 5 分に縮め、待ち時間(for)も無くしています。
  # 演習で不要なら、この group を丸ごと消すか、コメントにしてください(読み直し: curl -X POST http://localhost:19090/-/reload)。
  - name: slo-burn-rate-demo
    rules:
      - alert: ErrorBudgetBurnDemo
        expr: |
          job:slo_burn_rate:1m{job=~"storefront|api"} > 14.4
          and
          job:slo_burn_rate:5m{job=~"storefront|api"} > 14.4
        for: 0s
        labels:
          severity: demo
          purpose: デモ用
        annotations:
          summary: "【デモ用】{{ $labels.job }}: バーンレートが 14.4 を超えました(1 分窓と 5 分窓)"
          description: "演習用の短い窓のアラートです。1 分窓のバーンレート: {{ $value | printf \"%.1f\" }}"

  - name: ssr
    rules:
      # SSR のフォールバック率が 5% を超えたら警告します。
      # フォールバック = API が遅いなどで SSR を諦め、ブラウザで組み立てる空の HTML を返したこと。
      # 画面は出るが、初回表示が遅くなり、検索エンジンにも中身が見えません。
      - alert: SSRFallbackRatioHigh
        expr: job:ssr_fallback:ratio_rate5m > 0.05
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }}: SSR のフォールバック率が 5% を超えています"
          description: "直近 5 分のフォールバック率: {{ $value | humanizePercentage }}。API の遅延(latencyMs)を疑ってください。"

      # SSR そのものが失敗している(例: サーバー側で window を触って落ちた)。
      - alert: SSRErrors
        expr: job:ssr_errors:rate5m > 0
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "{{ $labels.job }}: SSR でエラーが起きています"
          description: "1 秒あたり {{ $value | printf \"%.2f\" }} 件の SSR エラー。storefront のログ(Grafana の Loki パネル)を確かめてください。"

  - name: cronjob
    rules:
      # 定期ジョブが止まっている(5 分以上、1 回も成功していない)。
      # 画面は動いているのに、在庫や検索の索引がだんだん古くなる「気付きにくい障害」を見つけます。
      # cronjob_last_success_timestamp_seconds は worker の起動した時刻から始まるので、起動直後に鳴ることはありません。
      # job ラベルはジョブ名です(prometheus.yml の worker の honor_labels: true のため)。
      - alert: CronJobStale
        expr: time() - cronjob_last_success_timestamp_seconds > 300
        for: 0s
        labels:
          severity: ticket
        annotations:
          summary: "定期ジョブ {{ $labels.job }} が 5 分以上成功していません"
          description: "最後の成功から {{ $value | humanizeDuration }} たちました。worker のログ(service=\"worker\")と、カオス cronFail を確かめてください。"

      # 定期ジョブの半分以上が失敗している(止まり切る前に気付くため)。
      - alert: CronJobFailureRatioHigh
        expr: job:cronjob_failure:ratio_rate5m > 0.5
        for: 1m
        labels:
          severity: ticket
        annotations:
          summary: "定期ジョブ {{ $labels.job }} の失敗が多くなっています"
          description: "直近 5 分の失敗率: {{ $value | humanizePercentage }}。"

  # ---- デモ用: 定期ジョブの止まりを 1 分で鳴らす(本番では使いません) ----
  # CHAOS_CRON_FAIL=true CRON_INTERVAL_SECONDS=10 docker compose up -d worker で、約 1〜2 分で鳴ります。
  - name: cronjob-demo
    rules:
      - alert: CronJobStaleDemo
        expr: time() - cronjob_last_success_timestamp_seconds > 60
        # ふだん(60 秒ごとに成功)でも、次の成功が指標に載るまでの数秒は 60 秒を超えます。
        # 一瞬の超えで鳴らないよう、30 秒続いたときだけ鳴らします(ジョブが止まれば約 1 分半で鳴ります)。
        for: 30s
        labels:
          severity: demo
          purpose: デモ用
        annotations:
          summary: "【デモ用】定期ジョブ {{ $labels.job }} が 1 分以上成功していません"
          description: "演習用の短いしきい値のアラートです。本物の CronJobStale は 5 分で鳴ります。"

  - name: targets
    rules:
      # 指標を取りに行けない = そのサービスが落ちているかもしれない。
      - alert: TargetDown
        expr: up{job=~"storefront|api|backoffice|worker"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "{{ $labels.job }} の指標が取れません(停止しているかもしれません)"
          description: "Prometheus から {{ $labels.instance }} に届きません。docker compose ps で状態を確かめてください。"
