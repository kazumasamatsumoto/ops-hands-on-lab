# Prometheus の設定です。「どこから・何秒ごとに指標を集めるか」と「どのルールを使うか」を書きます。
global:
  scrape_interval: 5s # 5 秒ごとに集める(ラボなので短め。本番は 15〜60 秒が多い)
  evaluation_interval: 5s # ルールを 5 秒ごとに計算する

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]

  - job_name: web
    metrics_path: /metrics
    static_configs:
      - targets: ["web:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
