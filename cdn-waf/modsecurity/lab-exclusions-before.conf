# ラボ用の「例外ルール」を書く場所です(OWASP CRS の本体ルールより先に読み込まれます)。
#
# WAF は「怪しい入力」を点数で判定します。まじめな入力でも点数が上がって 403 になることがあります(誤遮断)。
# そのときは、闇雲に WAF を切るのではなく、「どの URL の、どの項目だけ、どのルールを外すか」を狭く決めて書きます。
#
# 下は書き方の見本です。先頭の # を外すと有効になります(cdn-waf の再起動が必要: docker compose restart cdn-waf)。
#
# 例 1: 商品検索(api.lab.localhost の products/search の query)だけ、SQL インジェクション検知ルール 942100 を外す
# SecRule REQUEST_URI "@beginsWith /occ/v2/samplestore/products/search" \
#     "id:1000,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:query"
#
# ルール ID は cdn-waf のログ(docker compose logs cdn-waf)の "ruleId" で分かります。
# 自分で作るルールの ID は 1〜99999 の範囲を使います(CRS 本体とぶつからないように)。
#
# 例 2: Cookie を検査の対象から外す(第 1 版で有効にしていた例外。今は使っていません)
#   第 1 版はお店を http://localhost:18080 で開いていたため、同じ PC で動く別のアプリの「localhost の Cookie」が一緒に送られ、
#   その長い文字列を WAF が怪しいと判定して 403 になりました(実際に起きた誤遮断です)。
#   第 2 版は www.lab.localhost などの専用のホスト名を使うので、別のアプリの Cookie は送られなくなり、この例外は要らなくなりました。
#   例外は「要らなくなったら外す」のも大事です(外さないと、そこが検査の穴として残り続けます)。
# SecAction "id:1001,phase:1,pass,nolog,\
#     ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES,\
#     ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES_NAMES"
