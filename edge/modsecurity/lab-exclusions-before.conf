# ラボ用の「例外ルール」を書く場所です(OWASP CRS の本体ルールより先に読み込まれます)。
#
# WAF は「怪しい入力」を点数で判定します。まじめな入力でも点数が上がって 403 になることがあります(誤遮断)。
# そのときは、闇雲に WAF を切るのではなく、「どの URL の、どの項目だけ、どのルールを外すか」を狭く決めて書きます。
#
# 下は書き方の見本です。先頭の # を外すと有効になります(edge の再起動が必要: docker compose restart edge)。
#
# 例: 商品検索(/api/products の q)だけ、SQL インジェクション検知ルール 942100 を外す
# SecRule REQUEST_URI "@beginsWith /api/products" \
#     "id:1000,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:q"
#
# ルール ID は edge のログ(docker compose logs edge)の "ruleId" で分かります。
# 自分で作るルールの ID は 1〜99999 の範囲を使います(CRS 本体とぶつからないように)。

# ---------------------------------------------------------------------------
# 有効にしている例外(1 つだけ)
# ---------------------------------------------------------------------------
# ブラウザは「localhost」の Cookie を、ポート番号が違う別のアプリ(開発中の別サイトなど)とも共有します。
# その中の長い文字列(base64 など)を WAF が「怪しい」と判定し、ラボの画面が 403 になることがありました(実際に起きた誤遮断です)。
# サンプルストアは Cookie を使わない(ログインの印は Authorization ヘッダの JWT)ので、Cookie だけを検査の対象から外します。
# 範囲を「Cookie だけ」に絞り、URL やパラメータの検査はそのまま残しているのがポイントです。
SecAction "id:1001,phase:1,pass,nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES_NAMES"
