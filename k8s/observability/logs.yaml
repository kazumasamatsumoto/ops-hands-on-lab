# ---------- Loki(ログの保管庫) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: loki }
  template:
    metadata:
      labels: { app.kubernetes.io/name: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: ["-config.file=/etc/loki/loki.yml"]
          ports:
            - { name: web, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: web }
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 320Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
      volumes:
        - { name: config, configMap: { name: loki-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app.kubernetes.io/name: loki }
spec:
  selector: { app.kubernetes.io/name: loki }
  ports:
    - { name: web, port: 3100, targetPort: web }
---
# ---------- Alloy(Pod のログを運ぶ係) ----------
# Kubernetes の API から、lab と ingress-nginx の 2 つの部屋の Pod のログを読みます。2 つの部屋にまたがるので ClusterRole で権限を渡します。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: lab-alloy
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: lab-alloy
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: lab }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: lab-alloy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app.kubernetes.io/name: alloy }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alloy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alloy }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - { name: web, containerPort: 12345 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy/data }
      volumes:
        - { name: config, configMap: { name: alloy-config } }
        - { name: data, emptyDir: {} }
