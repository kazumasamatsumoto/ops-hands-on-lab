# ---------- Prometheus(指標) ----------
# Prometheus が Kubernetes に「Pod の一覧」を聞けるよう、権限を渡します(ServiceAccount + Role)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
subjects:
  - { kind: ServiceAccount, name: prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: prometheus }
  template:
    metadata:
      labels: { app.kubernetes.io/name: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=31d
            - --web.enable-lifecycle
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: rules, configMap: { name: prometheus-rules } }
        - { name: data, emptyDir: {} }
---
# NodePort = ノード(kind のコンテナ)の決まった番号で外に出す Service です。kind-config.yaml でホストの 19090 → 30090 につないでいます。
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app.kubernetes.io/name: prometheus }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: prometheus }
  ports:
    - { name: web, port: 9090, targetPort: web, nodePort: 30090 }
---
# ---------- Alertmanager(通知のまとめ役) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alertmanager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { name: web, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - { name: config, configMap: { name: alertmanager-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: { app.kubernetes.io/name: alertmanager }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: alertmanager }
  ports:
    - { name: web, port: 9093, targetPort: web, nodePort: 30093 }
---
# ---------- pager(通知の受け口。Alertmanager から webhook を受けて画面に並べるだけ) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager
  labels: { app.kubernetes.io/name: pager }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pager }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pager }
    spec:
      securityContext:
        runAsUser: 1000 # node:alpine イメージの一般ユーザー node
        runAsGroup: 1000
      containers:
        - name: pager
          image: node:24.21.0-alpine
          command: ["node", "/app/server.mjs"]
          env:
            - { name: PORT, value: "9094" }
          ports:
            - { name: web, containerPort: 9094 }
          readinessProbe:
            httpGet: { path: /healthz, port: web }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { memory: 64Mi }
          volumeMounts:
            - { name: app, mountPath: /app/server.mjs, subPath: server.mjs, readOnly: true }
      volumes:
        - { name: app, configMap: { name: pager-app } }
---
apiVersion: v1
kind: Service
metadata:
  name: pager
  labels: { app.kubernetes.io/name: pager }
spec:
  type: NodePort
  selector: { app.kubernetes.io/name: pager }
  ports:
    - { name: web, port: 9094, targetPort: web, nodePort: 30094 }
