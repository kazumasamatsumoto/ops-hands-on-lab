# Secret(秘密の値の入れ物)です。manifest.json の secrets に書いた名前(lab-secrets)と鍵(PGPASSWORD・BACKOFFICE_PASSWORD)に合わせています。
#
# !!! ここにあるのはラボ専用の「見本の値」です。本物の秘密ではありません !!!
# 軽量版(docker-compose.yml)と同じ値です。本番では、秘密の値をこのようにファイルに書いてリポジトリに入れてはいけません
# (CCv2 なら Cloud Portal の環境変数・秘密の置き場所、一般の Kubernetes なら外部の秘密管理や暗号化した Secret を使います)。
#
# Secret は「base64 で書き換えただけ」で、暗号ではありません。kubectl -n lab get secret lab-secrets -o yaml で誰でも読めます。
apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  labels:
    lab/dummy-values: "true" # 見本の値である目印
type: Opaque
stringData:
  PGPASSWORD: store # DB のパスワード(見本。db の POSTGRES_PASSWORD と api・backoffice・worker の PGPASSWORD の両方に使う)
  BACKOFFICE_PASSWORD: admin # 管理画面 admin のパスワード(見本)
