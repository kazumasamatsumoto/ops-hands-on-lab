# ConfigMap(設定の入れ物)です。アプリに渡す環境変数をここにまとめます。
#
# 値を変えたあとは、Pod を作り直さないと反映されません:
#   kubectl -n lab apply -k k8s/manifests
#   kubectl -n lab rollout restart deploy/api     (web なら deploy/web)
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
data:
  PORT: "3001"
  PGHOST: db
  PGUSER: store
  PGDATABASE: store
  LOG_LEVEL: info
  # わざと壊すスイッチの「起動時の値」。動かしながら変えるときは k8s/chaos.sh を使います。
  CHAOS_LATENCY_MS: "0"
  CHAOS_ERROR_RATE: "0"
  CHAOS_LEAK_MB: "0"
  CHAOS_IDOR_BUG: "false"
  CHAOS_SQLI_BUG: "false"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
data:
  PORT: "4000"
  RENDER_MODE: ssr # ssr または csr
  API_INTERNAL_URL: http://api:3001 # サーバーで描画するときに api を呼ぶ先(Service の名前)
  SSR_TIMEOUT_MS: "3000"
  SSR_WINDOW_BUG: "false"
  # Angular SSR は知らない Host ヘッダを 400 で断ります。edge から来る名前を許可しておきます。
  NG_ALLOWED_HOSTS: localhost,127.0.0.1,web,edge
