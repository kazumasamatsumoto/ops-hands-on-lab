# 観測の道具一式(Prometheus・Alertmanager・pager・Grafana・Loki・Alloy)です。Helm は使わず、最小構成で書いています。
# 設定ファイルは軽量版(observability/)と同じ物を、k8s/up.sh が ConfigMap に入れます。
# 本格版で中身が違うのは次の 2 つだけです(k8s/config/ にあります):
#   - Prometheus の収集先: 決まった名前ではなく、Kubernetes に「今いる api / web の Pod」を聞いて全部集める
#   - Alloy のログの集め方: Docker のソケットではなく、Kubernetes の API から Pod のログを読む
# データは emptyDir(Pod が消えると消える一時置き場)に置きます。ラボなので割り切っています。

# ---------- Prometheus(指標) ----------
# Prometheus が Kubernetes に「Pod の一覧」を聞けるよう、権限を渡します(ServiceAccount + Role)。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
subjects:
  - { kind: ServiceAccount, name: prometheus }
roleRef:
  { apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=31d
            - --web.enable-lifecycle
          ports:
            - { name: http, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml, readOnly: true }
            - { name: rules, mountPath: /etc/prometheus/rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: rules
          configMap: { name: prometheus-rules }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app: prometheus }
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: http, nodePort: 30090 }
---
# ---------- Alertmanager(通知のまとめ役) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  labels: { app: alertmanager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alertmanager }
  template:
    metadata:
      labels: { app: alertmanager }
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.34.1
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
          ports:
            - { name: http, containerPort: 9093 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alertmanager, readOnly: true }
            - { name: data, mountPath: /alertmanager }
      volumes:
        - name: config
          configMap: { name: alertmanager-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  labels: { app: alertmanager }
spec:
  type: NodePort
  selector: { app: alertmanager }
  ports:
    - { name: http, port: 9093, targetPort: http, nodePort: 30093 }
---
# ---------- pager(通知の受け口) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pager
  labels: { app: pager }
spec:
  replicas: 1
  selector:
    matchLabels: { app: pager }
  template:
    metadata:
      labels: { app: pager }
    spec:
      securityContext:
        runAsUser: 1000 # node:alpine イメージの一般ユーザー node
        runAsGroup: 1000
      containers:
        - name: pager
          image: node:24.21.0-alpine
          command: ["node", "/app/server.mjs"]
          env:
            - { name: PORT, value: "9094" }
          ports:
            - { name: http, containerPort: 9094 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 24Mi }
            limits: { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: app, mountPath: /app/server.mjs, subPath: server.mjs, readOnly: true }
      volumes:
        - name: app
          configMap: { name: pager-app }
---
apiVersion: v1
kind: Service
metadata:
  name: pager
  labels: { app: pager }
spec:
  type: NodePort
  selector: { app: pager }
  ports:
    - { name: http, port: 9094, targetPort: http, nodePort: 30094 }
---
# ---------- Grafana(ダッシュボード) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.4.11
          env:
            # ラボなので、ログインしなくても閲覧だけはできるようにします(本番ではしません)。
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            # 編集したいときの管理者(ラボ専用の見本の値です)。
            - { name: GF_SECURITY_ADMIN_USER, value: admin }
            - { name: GF_SECURITY_ADMIN_PASSWORD, value: admin }
            - { name: GF_USERS_DEFAULT_LANGUAGE, value: ja-JP }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /etc/grafana/dashboards/samplestore-slo.json }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: "false" }
            - { name: GF_NEWS_NEWS_FEED_ENABLED, value: "false" }
          ports:
            - { name: http, containerPort: 3000 }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: "1", memory: 256Mi }
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true }
            - { name: dashboard-providers, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true }
            - { name: dashboards, mountPath: /etc/grafana/dashboards, readOnly: true }
            - { name: data, mountPath: /var/lib/grafana }
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboard-providers
          configMap: { name: grafana-dashboard-providers }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels: { app: grafana }
spec:
  type: NodePort
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: http, nodePort: 30300 }
---
# ---------- Loki(ログの保管庫) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  labels: { app: loki }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: loki }
  template:
    metadata:
      labels: { app: loki }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.7.8
          args: ["-config.file=/etc/loki/loki.yml"]
          ports:
            - { name: http, containerPort: 3100 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  labels: { app: loki }
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: http }
---
# ---------- Alloy(ログを運ぶ係) ----------
# Kubernetes の API から lab の部屋の Pod のログを読み、Loki へ送ります。そのための権限を渡します。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
rules:
  - apiGroups: [""]
    resources: [pods, pods/log]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
subjects:
  - { kind: ServiceAccount, name: alloy }
roleRef:
  { apiGroup: rbac.authorization.k8s.io, kind: Role, name: alloy }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  labels: { app: alloy }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alloy }
  template:
    metadata:
      labels: { app: alloy }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.0
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - { name: http, containerPort: 12345 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 192Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy/data }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          emptyDir: {}
