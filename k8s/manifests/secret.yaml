# Secret(秘密の値の入れ物)です。
#
# !!! ここにあるのはラボ専用の「見本の値」です。本物の秘密ではありません !!!
# 軽量版(docker-compose.yml)と同じ値にしています。本番では、秘密の値をこのようにファイルに書いて
# リポジトリに入れてはいけません(外部の秘密管理サービスや、暗号化した Secret を使います)。
#
# Secret は「base64 で書き換えただけ」で、暗号ではありません。kubectl get secret で誰でも読めます。
apiVersion: v1
kind: Secret
metadata:
  name: lab-secrets
  labels:
    lab/dummy-values: "true" # 見本の値である目印
type: Opaque
stringData:
  POSTGRES_PASSWORD: store # DB のパスワード(見本)
  JWT_SECRET: lab-only-not-a-real-secret # ログインの印(JWT)の署名鍵(見本)
