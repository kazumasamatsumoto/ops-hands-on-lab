# 本格版(kind = Docker の中で動く Kubernetes)のクラスタ定義です。
#
#   作る:   kind create cluster --config k8s/kind-config.yaml   (ふだんは k8s/up.sh が代わりにやります)
#   消す:   kind delete cluster --name lab                     (k8s/down.sh)
#
# ノード(Kubernetes が Pod を置く台)は 1 台だけです。メモリを節約するためです。
# kind のノードは「Docker のコンテナ 1 個」です。その中にさらに Pod(アプリのコンテナ)が入ります。
#
# ホスト側のポートは軽量版(docker compose)と同じ番号にしています。
# そのため、軽量版と本格版を同時に動かすことはできません(先に docker compose down してください)。
#   ホスト 18080 → ノードの 30080 → edge の Service(NodePort)
#   ホスト 13000 → 30300 → Grafana / 19090 → 30090 → Prometheus
#   ホスト 19093 → 30093 → Alertmanager / 19094 → 30094 → pager
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: lab
nodes:
  - role: control-plane
    # kind v0.30.0 の既定のノードイメージです(バージョンを固定しています)。
    image: kindest/node:v1.34.0
    extraPortMappings:
      # listenAddress を 127.0.0.1 にして、同じネットワークの他の PC からは見えないようにします。
      - { containerPort: 30080, hostPort: 18080, listenAddress: "127.0.0.1", protocol: TCP } # edge(お店の入口)
      - { containerPort: 30300, hostPort: 13000, listenAddress: "127.0.0.1", protocol: TCP } # Grafana
      - { containerPort: 30090, hostPort: 19090, listenAddress: "127.0.0.1", protocol: TCP } # Prometheus
      - { containerPort: 30093, hostPort: 19093, listenAddress: "127.0.0.1", protocol: TCP } # Alertmanager
      - { containerPort: 30094, hostPort: 19094, listenAddress: "127.0.0.1", protocol: TCP } # pager
