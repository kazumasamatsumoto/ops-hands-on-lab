# このファイルは tools/manifest/render.mjs が manifest.json から作りました。手で直さず、manifest.json を直して作り直してください。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: samplestore
    lab/role: storefront
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: samplestore
        lab/role: storefront
      annotations:
        lab/metrics-port: "4000"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: storefront
          image: "lab/web:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            - name: PORT
              value: "4000"
            - name: RENDER_MODE
              value: ssr
            - name: SSR_TIMEOUT_MS
              value: "3000"
            - name: API_INTERNAL_URL
              value: "http://api:3001"
            - name: API_PUBLIC_URL
              value: "http://api.lab.localhost:18080"
            - name: NG_ALLOWED_HOSTS
              value: "www.lab.localhost,storefront,localhost,127.0.0.1"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "384Mi"
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: samplestore
    lab/role: storefront
spec:
  selector:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: samplestore
  ports:
    - name: http
      port: 4000
      targetPort: http
