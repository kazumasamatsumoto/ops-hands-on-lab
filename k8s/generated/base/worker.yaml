# このファイルは tools/manifest/render.mjs が manifest.json から作りました。手で直さず、manifest.json を直して作り直してください。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: samplestore
    lab/aspect: backgroundProcessing
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        app.kubernetes.io/part-of: samplestore
        lab/aspect: backgroundProcessing
      annotations:
        lab/metrics-port: "3001"
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: worker
          image: "lab/api:local"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: ASPECT
              value: backgroundProcessing
            - name: PORT
              value: "3001"
            - name: PGHOST
              value: db
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: store
            - name: PGUSER
              value: store
            - name: LOG_LEVEL
              value: info
            - name: SEARCH_PROVIDER
              value: db
            - name: CRON_INTERVAL_SECONDS
              value: "60"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector:4318"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab-secrets
                  key: PGPASSWORD
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "96Mi"
            limits:
              memory: "192Mi"
          lifecycle:
            preStop:
              sleep:
                seconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: samplestore
    lab/aspect: backgroundProcessing
spec:
  selector:
    app.kubernetes.io/name: worker
    app.kubernetes.io/part-of: samplestore
  ports:
    - name: http
      port: 3001
      targetPort: http
