# このファイルは tools/manifest/render.mjs が manifest.json から作りました。手で直さず、manifest.json を直して作り直してください。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: samplestore
    lab/endpoint: www
  annotations: {}
spec:
  ingressClassName: nginx
  rules:
    - host: www.lab.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: storefront
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: www-blocked
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: samplestore
    lab/endpoint: www
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "0.0.0.0/0"
spec:
  ingressClassName: nginx
  rules:
    - host: www.lab.localhost
      http:
        paths:
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: storefront
                port:
                  number: 4000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: samplestore
    lab/endpoint: api
  annotations: {}
spec:
  ingressClassName: nginx
  rules:
    - host: api.lab.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ratelimit-1
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: samplestore
    lab/endpoint: api
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "1"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "5"
spec:
  ingressClassName: nginx
  rules:
    - host: api.lab.localhost
      http:
        paths:
          - path: /authorizationserver/oauth/token
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-blocked
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: samplestore
    lab/endpoint: api
  annotations:
    nginx.ingress.kubernetes.io/denylist-source-range: "0.0.0.0/0"
spec:
  ingressClassName: nginx
  rules:
    - host: api.lab.localhost
      http:
        paths:
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: api
                port:
                  number: 3001
---
