# このファイルは tools/manifest/render.mjs が manifest.json から作りました。手で直さず、manifest.json を直して作り直してください。
# 環境 d1: 開発環境。1 台ずつ、キャッシュなし(変えた物がすぐ見える)、お店も社内からだけ
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lab
resources:
  - ../../base
replicas:
  - name: storefront
    count: 1
  - name: api
    count: 1
  - name: backoffice
    count: 1
  - name: worker
    count: 1
configMapGenerator:
  - name: lab-environment
    literals:
      - "LAB_ENV=d1"
      - "EDGE_CACHE=off"
      - "SEARCH_PROVIDER=solr"
generatorOptions:
  disableNameSuffixHash: true
patches:
  - path: patches/env-api.yaml
  - path: patches/env-backoffice.yaml
  - path: patches/env-worker.yaml
  - path: patches/ip-filter-www.yaml
  - path: patches/ip-filter-api.yaml
  - path: patches/ip-filter-api-ratelimit-1.yaml
