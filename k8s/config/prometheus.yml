# 本格版(Kubernetes)の Prometheus の設定です。軽量版(observability/prometheus/prometheus.yml)との違いは収集先だけです。
#
# 軽量版: 「api:3001」のように決まった名前を 1 つ書けば足りました(api は 1 つだけだから)。
# 本格版: api も web も Pod が 2 つ以上あり、作り直すたびに IP が変わります。
#         そこで Kubernetes に「今いる Pod の一覧」を聞き(kubernetes_sd_configs)、全部から集めます。
#         job には Pod の app ラベル(api / web)を入れるので、ルールとダッシュボードは軽量版のまま使えます。
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: lab-pods
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [lab]
    relabel_configs:
      # api(3001 番)と web(4000 番)の Pod だけを残します。
      - source_labels: [__meta_kubernetes_pod_label_app, __meta_kubernetes_pod_container_port_number]
        regex: "api;3001|web;4000"
        action: keep
      # job = app ラベル(api / web)
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      # どの Pod の数字か分かるように、Pod の名前も付けます。
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
